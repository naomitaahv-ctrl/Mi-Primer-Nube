```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sanrio World</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffe6f2;
            margin: 0;
            padding: 40px;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #e85d9e;
            font-size: 40px;
        }

        h2 {
            color: #ff8fbd;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        #personaje {
            font-size: 30px;
            font-weight: bold;
            color: #e85d9e;
            margin: 25px;
        }

        button {
            background-color: #ff8fbd;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e85d9e;
        }

        .corazones {
            color: #ff8fbd;
            font-size: 25px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="corazones">
            💗 🌸 💗 🌸 💗
        </div>

        <h1>Sanrio World</h1>

        <h2>✨ Mis personajes favoritos ✨</h2>

        <p>
            ¡Bienvenido a mi página de Sanrio!
        </p>

        <div id="personaje">
            Hello Kitty 🎀
        </div>

        <p id="descripcion">
            Una de las personajes más conocidas y queridas de Sanrio.
        </p>

        <button onclick="cambiarPersonaje()">
            Ver otro personaje ✨
        </button>

        <div class="corazones">
            💗 🌸 💗 🌸 💗
        </div>

    </div>


    <script>

        const personajes = [
            {
                nombre: "Hello Kitty 🎀",
                descripcion: "Una de las personajes más conocidas y queridas de Sanrio."
            },
            {
                nombre: "Cinnamoroll ☁️",
                descripcion: "Un adorable perrito blanco con largas orejas."
            },
            {
                nombre: "My Melody 🌸",
                descripcion: "Una dulce conejita que usa una bonita capucha."
            },
            {
                nombre: "Kuromi 🖤",
                descripcion: "Un personaje divertido, travieso y con mucha personalidad."
            },
            {
                nombre: "Pompompurin 🍮",
                descripcion: "Un perrito amarillo al que le encanta el pudín."
            }
        ];

        let numero = 0;

        function cambiarPersonaje() {

            numero++;

            if (numero >= personajes.length) {
                numero = 0;
            }

            document.getElementById("personaje").innerText =
                personajes[numero].nombre;

            document.getElementById("descripcion").innerText =
                personajes[numero].descripcion;
        }

    </script>

</body>
</html>
```
